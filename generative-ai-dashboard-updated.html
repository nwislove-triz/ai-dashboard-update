const categories=['전체 서비스',...Array.from(new Set(services.map(s=>s.cat))),'Agent'];let selected='전체 서비스';const $=q=>document.querySelector(q);const grid=$('#grid');
function inCategory(s){return selected==='전체 서비스'||s.cat===selected||(extra[selected]||[]).includes(s.n)}
function filtered(){const q=$('#search').value.trim().toLowerCase();return services.filter(s=>inCategory(s)&&(!q||[s.n,s.c,s.cat,s.d,...s.tags].join(' ').toLowerCase().includes(q)))}
function render(){const list=filtered();$('#currentCategory').textContent=selected;$('#resultCount').textContent=`${list.length}개 서비스`;grid.innerHTML=list.length?list.map((s,i)=>`<article class="card" style="--accent:${s.a}"><div class="head"><div class="identity"><div class="icon">${s.icon}</div><div><div class="name">${s.n}</div><div class="company">${s.c}</div></div></div><button class="info" data-info="${i}" aria-label="${s.n} 정보">i</button></div><p class="desc">${s.d}</p><div class="tags">${s.tags.slice(0,4).map(t=>`<span class="tag">#${t}</span>`).join('')}</div><a class="site" href="${s.url}" target="_blank" rel="noreferrer">공식 사이트 ↗</a></article>`).join(''):'<div class="empty">검색 결과가 없습니다. 다른 검색어를 입력해 보세요.</div>';grid.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>openInfo(list[Number(b.dataset.info)]))}
function renderCategories(){const host=$('#categoryList');host.innerHTML=categories.map((c,i)=>{const count=services.filter(s=>c==='전체 서비스'||s.cat===c||(extra[c]||[]).includes(s.n)).length;return `<button class="cat ${c===selected?'active':''} ${i===0?'all':''}" data-cat="${c}"><span>${c}</span><small>${count}</small></button>`}).join('');host.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;hide('categoryOverlay');renderCategories();render()})}
function show(id){$('#'+id).classList.add('show');$('#'+id).setAttribute('aria-hidden','false')}function hide(id){$('#'+id).classList.remove('show');$('#'+id).setAttribute('aria-hidden','true')}
function openInfo(s){const secondary=Object.keys(extra).filter(c=>extra[c].includes(s.n));$('#infoModal').innerHTML=`<div class="modal-top"><div><div class="eyebrow">${s.cat}</div><h2>${s.n}</h2><div class="company">${s.c}</div></div><button class="close" data-close="infoOverlay">×</button></div><p>${s.d}</p><div class="tags">${s.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div><div class="facts"><div class="fact"><span>요금</span><b>${s.p}</b></div><div class="fact"><span>이용 환경</span><b>${s.pl}</b></div><div class="fact"><span>분류</span><b>${[s.cat,...secondary.filter(x=>x!==s.cat)].join(' · ')}</b></div><div class="fact"><span>제공사</span><b>${s.c}</b></div></div><a class="modal-link" href="${s.url}" target="_blank" rel="noreferrer">공식 사이트 열기 ↗</a><div class="modal-note">요금과 이용 환경은 서비스 정책·지역·결제 방식에 따라 달라질 수 있습니다.</div>`;$('#infoModal').querySelector('[data-close]').onclick=()=>hide('infoOverlay');show('infoOverlay')}
$('#openCategories').onclick=()=>show('categoryOverlay');$('#search').oninput=render;document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)hide(o.id)});document.querySelectorAll('[data-close="categoryOverlay"]').forEach(b=>b.onclick=()=>hide('categoryOverlay'));document.addEventListener('keydown',e=>{if(e.key==='Escape'){hide('categoryOverlay');hide('infoOverlay')}});renderCategories();render();
